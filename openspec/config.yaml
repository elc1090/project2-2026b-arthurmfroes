schema: spec-driven

context: |
  Escreva os artefatos em português.
  Antes de planejar execução paralela, implementar, revisar entregas ou retomar uma
  change, leia docs/development-workflow.md na raiz deste repositório e aplique a
  política de coordenação, isolamento e integração ali definida.

rules:
  design:
    - Ao dividir trabalho entre agentes, identifique contratos compartilhados e responsáveis por arquivos comuns.
  tasks:
    - Registre dependências e frentes de execução sem duplicar a lista de tarefas; cada tarefa deve indicar sua verificação.

operations:
  apply:
    guidance:
      - Consulte docs/development-workflow.md antes de delegar ou integrar; atualize o quadro de execução da change a cada entrega.
      - Consolide tarefas concluídas somente após integração e verificação dos critérios; registre verificações pendentes explicitamente.
  archive:
    guidance:
      - Confira as evidências e pendências do quadro de execução antes de recomendar o arquivamento.
